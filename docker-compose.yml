# =============================================================================
# SecurePAM Docker Compose
# =============================================================================
# Usage:
#   Dev mode (mock providers):  docker compose up --build
#   Lab mode (real services):   docker compose --profile lab up --build
#   Monitoring:                 docker compose --profile monitoring up --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Core Services (always started)
  # ---------------------------------------------------------------------------
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: securepam-keycloak-postgres
    profiles: ["lab"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - securepam-net

  postgres:
    image: postgres:16-alpine
    container_name: securepam-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securepam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepam_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-securepam}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securepam}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securepam-net

  redis:
    image: redis:7-alpine
    container_name: securepam-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securepam-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securepam-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-securepam}:${POSTGRES_PASSWORD:-securepam_dev_password}@postgres:5432/${POSTGRES_DB:-securepam}
      - REDIS_URL=redis://redis:6379/0
      - OPENBAO_ADDR=http://openbao:8200
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - recording_data:/data/recordings
      - openbao_runtime:/run/openbao:ro
      # Shared volume for NGINX upstream config files (Member 11)
      - gateway_config:/gateway-config
    command:
      - sh
      - -c
      - |
        if [ -s /run/openbao/app-token ]; then
          export OPENBAO_TOKEN="$$(cat /run/openbao/app-token)"
          export SECRET_PROVIDER=openbao
          export OPENBAO_ADDR=http://openbao:8200
        fi
        alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securepam-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securepam-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_APP_NAME=SecurePAM
    depends_on:
      - backend
    networks:
      - securepam-net

  # ---------------------------------------------------------------------------
  # Gateway Profile — Member 11: Web Gateway & Browser Isolation
  # Start with: docker compose --profile gateway up --build
  # This does NOT start with plain: docker compose up
  # ---------------------------------------------------------------------------

  nginx-gateway:
    build:
      context: ./gateway/nginx
      dockerfile: Dockerfile
    container_name: securepam-nginx-gateway
    profiles: ["gateway"]
    environment:
      # Never hardcode upstream hostnames or ports as secrets.
      # These are internal Docker service names — not sensitive.
      GATEWAY_BACKEND_HOST: ${GATEWAY_BACKEND_HOST:-backend}
      GATEWAY_BACKEND_PORT: ${GATEWAY_BACKEND_PORT:-8000}
      GATEWAY_TEST_UPSTREAM: ${GATEWAY_TEST_UPSTREAM:-backend:8000}
      # Auth token for NGINX→backend auth_request validation.
      # Must match GATEWAY_AUTH_TOKEN in the backend .env.
      GATEWAY_AUTH_TOKEN: ${GATEWAY_AUTH_TOKEN:-dev-insecure-change-me-in-production}
      # Internal control port — reachable from backend on Docker net, NOT from host
      GATEWAY_NGINX_CONTROL_PORT: ${GATEWAY_NGINX_CONTROL_PORT:-8081}
      # Browser isolation service
      GATEWAY_BROWSER_ISOLATION_HOST: ${GATEWAY_BROWSER_ISOLATION_HOST:-browser-isolation}
      GATEWAY_BROWSER_ISOLATION_PORT: ${GATEWAY_BROWSER_ISOLATION_PORT:-6080}
    ports:
      - "${GATEWAY_PORT:-7000}:7000"
      # Control port exposed to Docker network only (not bound to host 0.0.0.0)
      # Backend calls this on securepam-net to trigger nginx -s reload
      - "127.0.0.1:${GATEWAY_CONTROL_HOST_PORT:-18081}:8081"
    volumes:
      # Shared upstream config directory — backend writes here, NGINX reads at reload
      - gateway_config:/etc/nginx/conf.d/apps
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - securepam-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7000/gw/test-health"]
      interval: 10s
      timeout: 5s
      retries: 5

  browser-isolation:
    build:
      context: ./gateway/browser-isolation
      dockerfile: Dockerfile
    container_name: securepam-browser-isolation
    profiles: ["gateway"]
    environment:
      PORT: 6080
      BROWSER_ISOLATION_TOKEN: ${GATEWAY_AUTH_TOKEN:-dev-insecure-change-me-in-production}
    ports:
      - "127.0.0.1:${BROWSER_ISOLATION_HOST_PORT:-16080}:6080"
    networks:
      - securepam-net
    volumes:
      - recording_data:/data/recordings
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ---------------------------------------------------------------------------
  # Lab Profile — Real infrastructure services
  # ---------------------------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: securepam-keycloak
    profiles: ["lab"]

    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: start-dev
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy

    networks:
      - securepam-net

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: securepam-guacd
    profiles: ["lab"]
    networks:
      - securepam-net

  guacamole:
    image: guacamole/guacamole:1.5.5
    container_name: securepam-guacamole
    profiles: ["lab"]
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      POSTGRES_HOSTNAME: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB:-securepam}
      POSTGRES_USER: ${POSTGRES_USER:-securepam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepam_dev_password}
    ports:
      - "8081:8080"
    depends_on:
      - guacd
      - postgres
    networks:
      - securepam-net

  # In-memory dev server. Do not use this mode in production.
  # DNS alias "vault" keeps VAULT_URL=http://vault:8200 working.
  openbao:
    image: openbao/openbao:2.7.1
    container_name: securepam-openbao
    profiles: ["lab"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN_ID:-lab-dev-root-token}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      securepam-net:
        aliases:
          - vault

  openbao-init:
    image: openbao/openbao:2.7.1
    container_name: securepam-openbao-init
    profiles: ["lab"]
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN_ID:-lab-dev-root-token}
    volumes:
      - ./infrastructure/openbao/policies:/openbao/policies:ro
      - ./infrastructure/openbao/init-lab.sh:/openbao/init-lab.sh:ro
      - openbao_runtime:/openbao/runtime
    user: "0:0"
    entrypoint: ["/bin/sh", "/openbao/init-lab.sh"]
    depends_on:
      openbao:
        condition: service_healthy
    restart: "no"
    networks:
      - securepam-net

  # ---------------------------------------------------------------------------
  # Monitoring Profile
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: securepam-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - securepam-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: securepam-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - securepam-net

volumes:
  postgres_data:
  redis_data:
  recording_data:
  prometheus_data:
  grafana_data:
  openbao_runtime:
  keycloak_postgres_data:
  # Shared NGINX upstream config volume — backend writes, NGINX reads
  gateway_config:

networks:
  securepam-net:
    driver: bridge

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securepam-member5-policy-engine"
version = "2.0.0"
description = "Deterministic, risk-adaptive policy evaluation module for SecurePAM"
requires-python = ">=3.10"
# zoneinfo needs the tz database on Windows
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8.0", "sqlalchemy>=2.0", "fastapi>=0.110", "pydantic>=2.0", "httpx>=0.27"]
api = ["fastapi>=0.110", "pydantic>=2.0"]
db = ["sqlalchemy>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.setuptools.packages.find]
include = ["securepam_policy_engine*"]

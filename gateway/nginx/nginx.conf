##############################################################################
# SecurePAM — Web Gateway NGINX Configuration
# Member 11: Web Gateway & Browser Isolation
##############################################################################
#
# PURPOSE
# -------
# Standard reverse-proxy path for STANDARD_PROXY mode applications registered
# in SecurePAM.  The upstream target is NEVER taken from the client request —
# it is resolved exclusively from the Application registry by the FastAPI
# gateway router (backend/app/api/v1/gateway.py).
#
# Key capabilities:
#   - auth_request on every /gw/apps/{uuid}/ request → backend /api/v1/gateway/internal/auth
#   - Per-application upstream blocks loaded from /etc/nginx/conf.d/apps/
#   - NGINX resolver configured for dynamic upstream resolution
#   - Internal /internal/reload endpoint now triggers a config test + reload
#
# SECURITY INVARIANTS (enforced here, must not be weakened)
# ---------------------------------------------------------
# 1. No /proxy?url=<user-input> pattern.  Every upstream is named explicitly.
# 2. Unknown application IDs have no matching upstream block — NGINX returns 404.
# 3. Destinations come from trusted application configuration only.
# 4. Upstream timeouts are bounded.
# 5. Sensitive internal headers (X-Real-IP, X-Forwarded-*) are set by this
#    gateway, not blindly forwarded from the client.
# 6. Internal gateway-control paths are not exposed on the public listener.
# 7. Every proxied request passes through auth_request — no bypass exists.
# 8. X-Gateway-Auth-Token is set by NGINX from env var, never from the browser.
# 9. X-SecurePAM-App-ID is set by NGINX from the URI capture group, never
#    from a client header.
#
# ENVIRONMENT VARIABLES (substituted at container startup via envsubst)
# - GATEWAY_BACKEND_HOST      — FastAPI backend host (default: backend)
# - GATEWAY_BACKEND_PORT      — FastAPI backend port (default: 8000)
# - GATEWAY_TEST_UPSTREAM     — Test upstream host:port (default: backend:8000)
# - GATEWAY_AUTH_TOKEN        — Pre-shared secret for auth_request validation
##############################################################################

worker_processes auto;
pid        /tmp/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured JSON access log — easier to ship to SIEM
    log_format securepam_json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log securepam_json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # -------------------------------------------------------------------------
    # Global proxy defaults — overridden per-upstream where needed
    # -------------------------------------------------------------------------
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;
    proxy_buffering         off;       # stream responses for web apps
    proxy_http_version      1.1;
    proxy_redirect          off;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    # Resolver required when proxy_pass uses a variable (dynamic upstream routing).
    # Docker's internal DNS resolver is always available at 127.0.0.11 inside containers.
    # valid=30s: cache DNS results for 30s (limits DNS rebinding window).
    # ipv6=off: avoids IPv6 lookup failures in Docker bridge networks.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Remove hop-by-hop headers before forwarding
    proxy_set_header Connection "";

    # WebSocket connection upgrade mapping (for browser isolation / noVNC)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream IP Pinning map
    # If the internal auth_request hook returns X-SecurePAM-Upstream-Target,
    # use the exact validated IP:port (closing DNS rebinding window).
    # Otherwise fallback to the registered static $upstream_name.
    map $upstream_http_x_securepam_upstream_target $effective_upstream {
        default $upstream_http_x_securepam_upstream_target;
        ""      $upstream_name;
    }

    # The gateway credential cookie (securepam_gw) is the browser's proof of
    # session ownership. It goes only to the auth hook, never to upstreams:
    # this map removes it from the Cookie header forwarded to the application.
    map $http_cookie $cookie_without_gateway_credential {
        "~^(?<gw_before>|.*?;\s*)securepam_gw=[^;]*(?<gw_after>.*)$" "$gw_before$gw_after";
        default $http_cookie;
    }

    # -------------------------------------------------------------------------
    # Security: strip headers that could be abused to forge identity or
    # bypass authorization.  The gateway sets these authoritatively below.
    # -------------------------------------------------------------------------
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $remote_addr;   # reset, not append
    proxy_set_header X-Forwarded-Proto  $scheme;

    # Never trust a client-supplied host override
    proxy_set_header Host               $host;

    # Strip any auth header the client might try to pass through
    proxy_set_header Authorization      "";

    # Never forward gateway-internal headers or the gateway credential.
    proxy_set_header X-SecurePAM-Session-ID         "";
    proxy_set_header X-SecurePAM-Gateway-Credential "";
    proxy_set_header Cookie                         $cookie_without_gateway_credential;

    # -------------------------------------------------------------------------
    # Upstreams
    #
    # IMPORTANT: Add one `upstream` block per registered Application.
    # Per-application upstream configs are generated by the SecurePAM backend
    # (GET /api/v1/gateway/apps/{id}/proxy-config) and placed in:
    #   /etc/nginx/conf.d/apps/{app_uuid}.conf
    # The internal /internal/reload endpoint triggers nginx -s reload after
    # the config file is written.
    #
    # DO NOT add a catch-all upstream.  Unknown IDs must return 404/503.
    # -------------------------------------------------------------------------

    # FastAPI backend upstream — used for auth_request sub-requests
    upstream securepam_backend {
        server ${GATEWAY_BACKEND_HOST}:${GATEWAY_BACKEND_PORT};
        keepalive 16;
    }

    # Test upstream — SecurePAM backend health endpoint
    # Used only for integration testing; not a real application target.
    upstream securepam_test_upstream {
        server ${GATEWAY_TEST_UPSTREAM};
        keepalive 16;
    }

    # Browser Isolation daemon upstream
    upstream browser_isolation {
        server ${GATEWAY_BROWSER_ISOLATION_HOST}:${GATEWAY_BROWSER_ISOLATION_PORT};
        keepalive 16;
    }

    # Per-application upstream blocks are included from conf.d/apps/
    # Each file contains exactly one upstream {} block named app_<uuid_with_underscores>
    include /etc/nginx/conf.d/apps/*.conf;

    # Auth request sub-request location (internal — not publicly reachable)
    # -------------------------------------------------------------------------
    # This server sends the auth_request to the FastAPI backend at
    # /api/v1/gateway/internal/auth.  It must be defined in the http context
    # (not inside server {}) so that both the internal and public servers
    # can reference it.

    # -------------------------------------------------------------------------
    # Gateway API — internal control plane (NOT on the public port)
    # Listens on 127.0.0.1:8081 so it is only reachable from inside the
    # container or the Docker internal network, not from the public internet.
    # -------------------------------------------------------------------------
    server {
        # Listens on all interfaces inside the container so the backend container
        # can reach it via the Docker securepam-net network.
        # Security: Docker maps this only to 127.0.0.1:18081 on the host (never 0.0.0.0).
        # The 'allow' directive below adds a defense-in-depth check.
        listen 8081;
        server_name localhost;

        # Allow only Docker RFC1918 ranges (covers Docker bridge 172.x, custom subnets 10.x).
        # Deny everything else, including any traffic that bypasses Docker's port binding.
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.0/8;
        deny all;

        # Reload trigger: the backend calls this AFTER writing a new upstream conf file.
        # The nginx-reload-watcher.sh sidecar script polls for a reload signal file
        # OR this endpoint writes a signal file that the watcher detects.
        # Returns 200; the backend triggers reload
        # by writing /etc/nginx/conf.d/apps/.reload-signal and the watcher handles it.
        location = /internal/reload {
            default_type application/json;
            return 200 '{"status":"ok","note":"signal_reload_externally"}';
        }

        # Deny everything else on the control port
        location / {
            return 403;
        }
    }

    # -------------------------------------------------------------------------
    # Public gateway listener
    # -------------------------------------------------------------------------
    server {
        listen 7000 default_server;
        listen [::]:7000 default_server ipv6only=on;
        server_name _;

        # -----------------------------------------------------------------
        # Internal auth_request validation location.
        # This named location is used by auth_request to proxy the
        # sub-request to the FastAPI backend's internal auth endpoint.
        #
        # Security controls:
        # (a) proxy_pass goes to securepam_backend upstream (internal Docker net)
        # (b) X-Gateway-Auth-Token is set from env var — browser cannot supply it
        # (c) The gateway credential comes only from the securepam_gw cookie
        # (d) X-SecurePAM-App-ID is set from the URI capture group ($1) by the
        #     calling location block — browser cannot forge this
        # (e) proxy_pass_request_body off — auth sub-requests are GET only
        # -----------------------------------------------------------------
        location = /_internal_auth {
            internal;
            proxy_pass http://securepam_backend/api/v1/gateway/internal/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI      $request_uri;
            proxy_set_header X-Original-Method   $request_method;
            # Auth token — set from NGINX env var; browser cannot override
            proxy_set_header X-Gateway-Auth-Token "${GATEWAY_AUTH_TOKEN}";
            # Browser's proof of session ownership: the securepam_gw cookie only.
            # (An empty value drops the header, including any client-sent copy.)
            proxy_set_header X-SecurePAM-Gateway-Credential $cookie_securepam_gw;
            proxy_set_header X-SecurePAM-Session-ID "";
            # App ID — set by the calling location's set $app_id directive
            proxy_set_header X-SecurePAM-App-ID  $app_id;
        }

        # -----------------------------------------------------------------
        # Test route (unauthenticated — only proxies to /health which is public):
        #   GET /gw/test-health → SecurePAM backend /health
        # -----------------------------------------------------------------
        location = /gw/test-health {
            proxy_pass http://securepam_test_upstream/health;
            proxy_set_header Host ${GATEWAY_BACKEND_HOST};
            proxy_set_header Authorization "";
            proxy_set_header X-SecurePAM-Session-ID "";
        }

        # -----------------------------------------------------------------
        # Standard proxy route:
        #   /gw/apps/<application_uuid>/...
        #
        # Execution flow:
        # 1. Capture the UUID from the URL into $app_id.
        # 2. Run auth_request to validate the session + JIT grant.
        # 3. Proxy_pass to the per-app upstream block.
        #
        # The per-app upstream must exist (written by the config manager).
        # If no upstream block exists for this UUID, NGINX will fail to start
        # (config test will fail), so unknown UUIDs simply have no upstream
        # and will be handled by the error_page 502 → @upstream_error block.
        #
        # Security:
        # - $app_id is captured from the URL by NGINX (not from a header).
        # - auth_request runs BEFORE proxy_pass — no bypass.
        # - Browser cannot set X-Gateway-Auth-Token (NGINX overwrites it).
        # - Browser cannot set X-SecurePAM-App-ID (NGINX sets from $app_id).
        # -----------------------------------------------------------------
        # -----------------------------------------------------------------
        # -----------------------------------------------------------------
        # Browser Isolation route:
        #   /gw/apps/<application_uuid>/vnc/...
        #
        # Security:
        # - Placed before the generic app regex so /vnc/ routes take priority.
        # - Requires active session and valid JIT grant via auth_request.
        # - Maps WebSocket upgrade headers for noVNC / websockify stream.
        # - Proxies strictly to internal browser_isolation upstream.
        # -----------------------------------------------------------------
        # -----------------------------------------------------------------
        # Launch: redeem the single-use ticket for the credential cookie.
        #   /gw/apps/<application_uuid>/_launch?ticket=...
        # Must precede the regexes below. Not logged: the ticket is in the
        # query string (single-use and short-lived, but still kept out of logs).
        # -----------------------------------------------------------------
        location ~ "^/gw/apps/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/_launch$" {
            access_log off;
            set $app_id "$1";
            proxy_pass http://securepam_backend/api/v1/gateway/apps/$app_id/launch$is_args$args;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Cookie          "";
            proxy_set_header Authorization   "";
        }

        location ~ "^/gw/apps/([0-9a-f]{8})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{12})/vnc/(.*)$" {
            set $app_id   "$1-$2-$3-$4-$5";
            set $vnc_path "$6";

            proxy_set_header X-SecurePAM-App-ID "";

            auth_request /_internal_auth;
            # Session the auth hook authorized; the browser never sends a session ID.
            auth_request_set $auth_session_id $upstream_http_x_securepam_session_id;
            error_page 401 403 = @auth_denied;

            proxy_pass http://browser_isolation/vnc/$app_id?session_id=$auth_session_id;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-SecurePAM-Session-ID $auth_session_id;
            proxy_set_header X-SecurePAM-Gateway-Credential "";
            proxy_set_header Cookie $cookie_without_gateway_credential;
            proxy_set_header X-SecurePAM-App-ID $app_id;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # -----------------------------------------------------------------
        # Standard proxy route:
        #   /gw/apps/<application_uuid>/...
        # -----------------------------------------------------------------
        location ~ "^/gw/apps/([0-9a-f]{8})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{12})/(.*)$" {
            # $1-$5: UUID segments (hyphens stripped between groups)
            # $6: path after the UUID
            set $app_id   "$1-$2-$3-$4-$5";
            set $app_path "$6";

            # Build upstream name: app_{uuid_with_underscores}
            # Matches the name written by the backend config manager.
            set $upstream_name "app_$1_$2_$3_$4_$5";

            # SECURITY: Strip any browser-supplied X-SecurePAM-App-ID header
            proxy_set_header X-SecurePAM-App-ID "";

            # Auth gate — must return 200 before proxy_pass fires
            auth_request /_internal_auth;
            auth_request_set $upstream_target $effective_upstream;
            auth_request_set $upstream_host   $upstream_http_x_securepam_upstream_host;
            auth_request_set $upstream_auth   $upstream_http_x_securepam_upstream_authorization;

            # On auth failure, return 403 to the browser
            error_page 401 403 = @auth_denied;

            # Proxy to the per-application upstream or pinned destination IP.
            # $upstream_target is either the pinned IP:port returned by the auth hook,
            # or falls back to the static $upstream_name in conf.d/apps/.
            #
            # SECURITY: proxy_pass target comes exclusively from server-side database
            # and auth hook verification — never from client input.
            # Client-supplied Authorization is stripped and replaced with trusted server-side header if present.
            # Location-level proxy_set_header disables inheritance of the
            # http-level ones, so the identity/stripping headers are repeated.
            proxy_set_header Host $upstream_host;
            proxy_set_header Authorization $upstream_auth;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $remote_addr;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Connection         "";
            proxy_set_header X-SecurePAM-Session-ID         "";
            proxy_set_header X-SecurePAM-Gateway-Credential "";
            proxy_set_header Cookie $cookie_without_gateway_credential;
            proxy_pass http://$upstream_target/$app_path$is_args$args;

            # 502 = upstream block missing (config not yet synced)
            error_page 502 = @no_upstream;
        }

        # -----------------------------------------------------------------
        # Auth denied — when auth_request returns 403
        # -----------------------------------------------------------------
        location @auth_denied {
            default_type application/json;
            return 403 '{"detail":"Access denied. Your session is not authorized for this application."}';
        }

        # -----------------------------------------------------------------
        # No upstream block for this app (config not yet synced)
        # -----------------------------------------------------------------
        location @no_upstream {
            default_type application/json;
            return 404 '{"detail":"No upstream configured for this application. Contact your administrator."}';
        }

        # -----------------------------------------------------------------
        # Deny everything else
        # -----------------------------------------------------------------
        location / {
            return 404 '{"detail":"Not found."}';
            add_header Content-Type application/json;
        }

        # -----------------------------------------------------------------
        # Error pages — controlled, no stack traces
        # -----------------------------------------------------------------
        # 502/503/504 errors from upstreams that exist but are unreachable
        # (distinct from @no_upstream which handles missing upstream blocks)
        error_page 503 504 = @upstream_error;
        location @upstream_error {
            default_type application/json;
            return 503 '{"detail":"Upstream unavailable. Please try again later."}';
        }

        error_page 404 = @not_found;
        location @not_found {
            default_type application/json;
            return 404 '{"detail":"Not found."}';
        }
    }
}
